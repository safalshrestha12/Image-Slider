<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive vanilla JavaScript image slider library.">
  <title>Image Slider Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="slider.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="slider-card" aria-labelledby="slider-title">
      <p class="student-name">Safal Shrestha</p>
      <div class="intro">
        <p class="eyebrow">Vanilla JavaScript component</p>
        <h1 id="slider-title">Image Slider Library</h1>
        <p class="intro-copy">A responsive, infinitely looping slider built with DOM manipulation, event listeners, and CSS transforms.</p>
      </div>

      <div class="slider" data-slider>
        <div class="slider-viewport">
          <div class="slider-track" data-slider-track>
            <article class="slide">
              <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85" alt="Mountain valley beneath a blue sky">
              <div class="slide-caption"><span>01</span><h2>Open horizons</h2></div>
            </article>
            <article class="slide">
              <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1600&q=85" alt="Green forest with sunlight between the trees">
              <div class="slide-caption"><span>02</span><h2>Into the wild</h2></div>
            </article>
            <article class="slide">
              <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85" alt="Coastal landscape with waves and cliffs">
              <div class="slide-caption"><span>03</span><h2>Coastal rhythm</h2></div>
            </article>
            <article class="slide">
              <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85" alt="Lake surrounded by mountains and trees">
              <div class="slide-caption"><span>04</span><h2>Quiet waters</h2></div>
            </article>
          </div>
        </div>

        <button class="slider-control slider-control--prev" type="button" data-slider-prev aria-label="Show previous image">&#8592;</button>
        <button class="slider-control slider-control--next" type="button" data-slider-next aria-label="Show next image">&#8594;</button>

        <div class="slider-footer">
          <p class="slide-status" data-slider-status aria-live="polite">Slide 1 of 4</p>
          <div class="slider-dots" data-slider-dots role="tablist" aria-label="Choose an image"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
